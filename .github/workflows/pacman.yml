name: Generate Pac-Man Contribution Graph 🟡

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily
  workflow_dispatch:     # Allows manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVG with Platane/snk
        uses: Platane/snk@v3
        with:
          github_user_name: tharunkumarsurya
          outputs: |
            ./dist/github-contribution-grid-pacman.svg
            ./dist/github-contribution-grid-pacman-dark.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
