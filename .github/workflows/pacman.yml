name: generate pacman animation

permissions:
  contents: write

on:
  workflow_dispatch:   # Run manually for debugging

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Debug: Show current files
        run: ls -R

      - name: Run Pac-Man SVG generator
        run: |
          python generatorpacman.py
          echo "---- Dist folder after generation ----"
          ls -R dist || echo "Dist folder missing!"

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
