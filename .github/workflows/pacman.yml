name: Generate Pac-Man Contribution Graph

on:
  schedule: # run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Pac-Man contribution graph
        uses: ykdojo/contribution-pacman@main
        with:
          user_name: tharunkumarsurya
          color: yellow
          pacman_direction: right
          output_path: ./output/

      - name: Push generated SVG to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Update Pac-Man contribution graph" || echo "No changes"
          git push
