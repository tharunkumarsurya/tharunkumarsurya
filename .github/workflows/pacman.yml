name: generate pacman-animation

permissions:
  contents: write

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the master branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate pacman animation
      # (Replace with your actual Pac-Man generator command/script)
      - name: generate github-contribution-grid-pacman.svg
        run: |
          mkdir -p dist
          python generate_pacman.py --user tharunkumarsurya --output dist/github-contribution-grid-pacman.svg

      # Step 3: Push the animation to output branch
      - name: push github-contribution-grid-pacman.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
